[project]
name = "grocery-pipeline"
version = "1.0.0"
description = "An ETL pipeline powering analytics for a fictional grocery store chain using mock data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.14",
    "dotenv>=0.9.9",
    "fastexcel>=0.19.0",
    "ipykernel>=7.2.0",
    "pandas>=2.2, <3.0",
    "pandera[pandas,pyspark]>=0.31.1",
    "polars>=1.38.1",
    "prefect[aws,sqlalchemy]>=3.7.2",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=23.0.1",
    "pyspark>=4.1.1",
    "pytest>=9.1.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.47",
]
