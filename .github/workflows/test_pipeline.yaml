name: Test Pipeline
on: [
  push
]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - name: "Setup Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      
      - name: "Setup Java"
        uses: actions/setup-java@v5
        with: 
          distribution: temurin
          java-version: '17'
      
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.14
    
      - name: Install Project
        run: uv sync --locked --all-extras --dev
      
      - name: Create PostgreSQL fixture
        run: uv run python tests/fixtures/generate_fixtures.py --output tmp/fixture.sql

      - name: Initialize PostgreSQL fixture
        run: uv run python tests/fixtures/run_fixture_generation_script.py
      
      - name: Run Tests
        run: uv run pytest -s